<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIGHT MOTION PREMIUM GENERATOR BY R4VV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(0, 242, 255, 0.25);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2), 
                        0 0 25px rgba(0, 242, 255, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, #ff0055, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #8ab4f8;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #2a344e;
            border-radius: 8px;
            background-color: #121826;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        input:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-execute {
            background: linear-gradient(135deg, #ff0055, #cc0044);
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            margin-bottom: 5px;
        }

        .btn-execute:hover {
            background: linear-gradient(135deg, #ff1a66, #e6004c);
        }

        .btn-generate {
            background: linear-gradient(135deg, #00f2ff, #0077ff);
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
            margin-top: 5px;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #33f5ff, #1a8cff);
        }

        button:active {
            transform: scale(0.97);
        }

        .result {
            margin-top: 15px;
            font-size: 12px;
            word-wrap: break-word;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            display: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .success-text {
            display: block;
            background-color: rgba(0, 242, 255, 0.08);
            color: #00f2ff;
            border: 1px solid rgba(0, 242, 255, 0.4);
        }

        .error-text {
            display: block;
            background-color: rgba(255, 0, 85, 0.08);
            color: #ff4d88;
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        .loading-text {
            display: block;
            background-color: rgba(138, 180, 248, 0.08);
            color: #8ab4f8;
            border: 1px solid rgba(138, 180, 248, 0.4);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ALIGHT MOTION PREMIUM GENERATOR BY R4VV</h1>
    
    <div class="input-group">
        <label for="email">Masukkan Email</label>
        <input type="email" id="email" placeholder="contoh@gmail.com" required>
    </div>
    
    <button class="btn-execute" onclick="executeEmail()">Execute (Kirim Request Email)</button>

    <div class="input-group" style="margin-top: 15px;">
        <label for="linkUrl">Paste URL</label>
        <input type="text" id="linkUrl" placeholder="Paste URL verifikasi dari email di sini" required>
    </div>

    <button class="btn-generate" onclick="generatePremium()">Generate</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
    async function executeEmail() {
        const email = document.getElementById('email').value.trim();
        const resultBox = document.getElementById('resultBox');

        resultBox.textContent = '';
        resultBox.className = 'result';

        if (!email) {
            resultBox.className = 'result error-text';
            resultBox.textContent = 'Woy masukin dulu kolom email-nya, jangan setengah-setengah!';
            return;
        }

        resultBox.className = 'result loading-text';
        resultBox.textContent = 'Mengirim request execute email ke server...';

        try {
            // Menembak API dengan link kosong sesuai skema awal (untuk memicu kirim email)
            const apiUrl = `https://api.kyzznekoo.my.id/api/alightmotion/v1/applyPremium?email=${encodeURIComponent(email)}&link=`;

            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36',
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();

            // Tampilkan hasil sukses eksekusi di kotak bawah (tanpa alert yang ngebug di Acode)
            resultBox.className = 'result success-text';
            resultBox.innerHTML = `<strong>[EXECUTE BERHASIL]</strong><br>Email terkirim/terproses!<br><pre style="margin-top:5px; white-space: pre-wrap;">${JSON.stringify(data, null, 2)}</pre>`;
            
            // Otomatis nyimpen email ke memori internal buat bantuan
            localStorage.setItem('target_email', email);

        } catch (error) {
            resultBox.className = 'result error-text';
            resultBox.textContent = 'Gagal nge-hit API execute. Cek koneksi internet atau status server lu, sampah!';
            console.error('Error:', error);
        }
    }

    async function generatePremium() {
        const email = document.getElementById('email').value.trim();
        const link = document.getElementById('linkUrl').value.trim();
        const resultBox = document.getElementById('resultBox');

        resultBox.textContent = '';
        resultBox.className = 'result';

        if (!email || !link) {
            resultBox.className = 'result error-text';
            resultBox.textContent = 'Kolom Email dan Paste URL wajib diisi dengan benar, BAJINGAN!';
            return;
        }

        resultBox.className = 'result loading-text';
        resultBox.textContent = 'Menghubungkan ke API Generate...';

        try {
            const encodedEmail = encodeURIComponent(email);
            const encodedLink = encodeURIComponent(link);
            
            const apiUrl = `https://api.kyzznekoo.my.id/api/alightmotion/v1/applyPremium?email=${encodedEmail}&link=${encodedLink}`;

            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36',
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();

            resultBox.className = 'result success-text';
            resultBox.innerHTML = `<strong>[GENERATE BERHASIL]</strong><br><pre style="margin-top:5px; white-space: pre-wrap;">${JSON.stringify(data, null, 2)}</pre>`;
            
        } catch (error) {
            resultBox.className = 'result error-text';
            resultBox.textContent = 'API Generate gagal diakses atau diblokir sistem. Periksa kembali URL-nya!';
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
